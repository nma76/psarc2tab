<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Beta Feedpak export from a Rocksmith archive</title>
  <desc id="desc">A terminal example creates a beta FeedBack-compatible feedpak ZIP containing arrangements, a song timeline, lyrics when available, and a decoded WAV mix.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192a"/><stop offset="1" stop-color="#17353a"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030712" flood-opacity=".4"/></filter>
  </defs>
  <g transform="scale(1 0.9210526)">
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="94" r="116" fill="#37d6a5" opacity=".08"/>
  <circle cx="110" cy="700" r="165" fill="#65a8ff" opacity=".07"/>
  <text x="66" y="86" fill="#83b6a9" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">EXPORT PREVIEW  /  FEEDBACK FEEDPAK  /  BETA</text>
  <text x="66" y="132" fill="#f1f6fc" font-family="Arial, sans-serif" font-size="31" font-weight="700">A complete practice package from one archive.</text>
  <text x="66" y="165" fill="#a8b8cb" font-family="Arial, sans-serif" font-size="17">Bundle arrangements, timing, lyrics, and the decoded song mix for FeedBack.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="198" width="1072" height="182" rx="18" fill="url(#screen)" stroke="#314154" stroke-width="2"/>
    <path d="M82 198h1036a18 18 0 0 1 18 18v36H64v-36a18 18 0 0 1 18-18" fill="#202d3a"/>
    <circle cx="91" cy="226" r="6" fill="#ff6b6b"/><circle cx="112" cy="226" r="6" fill="#f6bd4f"/><circle cx="133" cy="226" r="6" fill="#45d483"/>
    <text x="600" y="231" text-anchor="middle" fill="#9eafc0" font-family="Arial, sans-serif" font-size="13">terminal  —  psarc2tab</text>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="93" y="285" fill="#61e6b2">$</text><text x="115" y="285" fill="#d8e2ed">psarc2tab --in song_p.psarc --out song.feedpak --format feedpak</text>
    <text x="93" y="328" fill="#61e6b2">✓</text><text x="115" y="328" fill="#d8e2ed">Wrote feedpak export to 'song.feedpak'.</text>
    <text x="93" y="356" fill="#8295a9" font-size="13">Requires vgmstream-cli with Wwise Vorbis support to decode the song mix.</text>
  </g>
  <text x="66" y="435" fill="#d8e4f0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Inside the Feedpak</text>
  <text x="1134" y="435" text-anchor="end" fill="#899ab1" font-family="Arial, sans-serif" font-size="14">ZIP package</text>
  <g font-family="Arial, sans-serif">
    <rect x="66" y="458" width="1068" height="60" rx="12" fill="#202b3b" stroke="#34465c"/>
    <rect x="66" y="458" width="210" height="60" rx="12" fill="#29364a"/>
    <text x="91" y="495" fill="#74d9c4" font-size="14" font-weight="700">ARRANGEMENTS</text>
    <text x="305" y="495" fill="#e6edf5" font-size="16">Lead, Rhythm, and Bass chart data</text>
    <rect x="66" y="531" width="1068" height="60" rx="12" fill="#202b3b" stroke="#34465c"/>
    <rect x="66" y="531" width="210" height="60" rx="12" fill="#29364a"/>
    <text x="91" y="568" fill="#aaa1ff" font-size="14" font-weight="700">SONG DATA</text>
    <text x="305" y="568" fill="#e6edf5" font-size="16">Shared timeline and lyrics when available</text>
    <rect x="66" y="604" width="1068" height="60" rx="12" fill="#202b3b" stroke="#34465c"/>
    <rect x="66" y="604" width="210" height="60" rx="12" fill="#29364a"/>
    <text x="91" y="641" fill="#f3bb70" font-size="14" font-weight="700">AUDIO MIX</text>
    <text x="305" y="641" fill="#e6edf5" font-size="16">Decoded PCM WAV for playback in FeedBack</text>
  </g>
  <text x="67" y="704" fill="#8295a9" font-family="Arial, sans-serif" font-size="13">Feedpak export packages all supported arrangements for a single song.</text>
  </g>
</svg>
