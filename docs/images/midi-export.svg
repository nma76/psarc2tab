<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Create a MIDI file from a Rocksmith archive</title>
  <desc id="desc">A terminal command exports all supported arrangements as one Standard MIDI type 1 file with a shared tempo map and a separate track for each arrangement.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10192a"/><stop offset="1" stop-color="#222544"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#0b1118"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#030712" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1200" height="760" rx="32" fill="url(#bg)"/>
  <circle cx="1070" cy="100" r="145" fill="#a78bfa" opacity=".1"/>
  <circle cx="112" cy="688" r="170" fill="#51d6bd" opacity=".06"/>
  <text x="66" y="86" fill="#a49ac7" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">EXPORT PREVIEW  /  STANDARD MIDI</text>
  <text x="66" y="132" fill="#f1f6fc" font-family="Arial, sans-serif" font-size="31" font-weight="700">One command. Your arrangements in MIDI.</text>
  <text x="66" y="165" fill="#a8b8cb" font-family="Arial, sans-serif" font-size="17">Export one part, or combine the supported parts into a single type 1 file.</text>
  <g filter="url(#shadow)">
    <rect x="64" y="198" width="1072" height="182" rx="18" fill="url(#screen)" stroke="#314154" stroke-width="2"/>
    <path d="M82 198h1036a18 18 0 0 1 18 18v36H64v-36a18 18 0 0 1 18-18" fill="#202d3a"/>
    <circle cx="91" cy="226" r="6" fill="#ff6b6b"/><circle cx="112" cy="226" r="6" fill="#f6bd4f"/><circle cx="133" cy="226" r="6" fill="#45d483"/>
    <text x="600" y="231" text-anchor="middle" fill="#9eafc0" font-family="Arial, sans-serif" font-size="13">terminal  —  psarc2tab</text>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16">
    <text x="93" y="285" fill="#61e6b2">$</text><text x="115" y="285" fill="#d8e2ed">psarc2tab --in song_p.psarc --out song.mid --format midi --arr all</text>
    <text x="93" y="328" fill="#61e6b2">✓</text><text x="115" y="328" fill="#d8e2ed">Wrote midi export to 'song.mid'.</text>
    <text x="93" y="356" fill="#8295a9" font-size="13">Existing files are protected. Beat and tempo data are used when available.</text>
  </g>
  <text x="66" y="435" fill="#d8e4f0" font-family="Arial, sans-serif" font-size="18" font-weight="700">Inside the MIDI file</text>
  <text x="1134" y="435" text-anchor="end" fill="#899ab1" font-family="Arial, sans-serif" font-size="14">Standard MIDI type 1</text>
  <g font-family="Arial, sans-serif">
    <rect x="66" y="458" width="1068" height="60" rx="12" fill="#202b3b" stroke="#34465c"/>
    <rect x="66" y="458" width="178" height="60" rx="12" fill="#29364a"/>
    <text x="90" y="483" fill="#74d9c4" font-size="14" font-weight="700">TRACK 1</text>
    <text x="90" y="503" fill="#e6edf5" font-size="16">Tempo map</text>
    <path d="M270 488H1108" stroke="#46556a" stroke-width="1"/>
    <path d="M294 488v-9m3 9v-16m3 16v-10m169 10v-9m3 9v-15m3 15v-10m169 10v-9m3 9v-16m3 16v-10m169 10v-9m3 9v-14m3 14v-9" stroke="#74d9c4" stroke-width="3" stroke-linecap="round"/>
    <rect x="66" y="531" width="1068" height="60" rx="12" fill="#202b3b" stroke="#34465c"/>
    <rect x="66" y="531" width="178" height="60" rx="12" fill="#29364a"/>
    <text x="90" y="556" fill="#aaa1ff" font-size="14" font-weight="700">TRACK 2+</text>
    <text x="90" y="576" fill="#e6edf5" font-size="16">Arrangements</text>
    <path d="M270 562H1108" stroke="#46556a" stroke-width="1"/>
    <g fill="#a99cff">
      <rect x="294" y="545" width="52" height="12" rx="3"/><rect x="352" y="560" width="36" height="12" rx="3"/><rect x="404" y="545" width="75" height="12" rx="3"/>
      <rect x="487" y="560" width="49" height="12" rx="3"/><rect x="548" y="545" width="40" height="12" rx="3"/><rect x="599" y="560" width="88" height="12" rx="3"/>
      <rect x="700" y="545" width="45" height="12" rx="3"/><rect x="757" y="560" width="58" height="12" rx="3"/><rect x="827" y="545" width="70" height="12" rx="3"/>
      <rect x="910" y="560" width="42" height="12" rx="3"/><rect x="964" y="545" width="65" height="12" rx="3"/><rect x="1040" y="560" width="50" height="12" rx="3"/>
    </g>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#a9b9cb">
    <text x="67" y="635">Separate instrument tracks</text><text x="418" y="635">Notes and chord tones</text><text x="741" y="635">Shared beat timeline (illustrative)</text>
  </g>
  <path d="M67 651H1134" stroke="#3a4960"/>
  <text x="67" y="682" fill="#8295a9" font-family="Arial, sans-serif" font-size="13">Tip: omit <tspan font-family="Consolas, monospace" fill="#c5baff">--arr all</tspan> to export all supported arrangements; use <tspan font-family="Consolas, monospace" fill="#c5baff">--arr 1</tspan> for one part.</text>
</svg>
