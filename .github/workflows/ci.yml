name: CI

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Psarc2Tab.slnx

      - name: Build solution
        run: dotnet build Psarc2Tab.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Psarc2Tab.slnx --configuration Release --no-build --no-restore
