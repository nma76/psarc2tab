name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Require a stable semantic version tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release tags must use the stable vMAJOR.MINOR.PATCH format; received '$env:RELEASE_TAG'."
          }

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require the tag to point to develop history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/develop

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Psarc2Tab.slnx

      - name: Build solution
        run: dotnet build Psarc2Tab.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Psarc2Tab.slnx --configuration Release --no-build --no-restore

  package:
    name: Package ${{ matrix.rid }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-2025
            extension: zip
          - rid: osx-arm64
            runner: macos-15
            extension: tar.gz
          - rid: linux-x64
            runner: ubuntu-24.04
            extension: tar.gz
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RID: ${{ matrix.rid }}
      PACKAGE_EXTENSION: ${{ matrix.extension }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore target runtime
        run: dotnet restore src/Psarc2Tab.Cli/Psarc2Tab.Cli.csproj --runtime $env:RID
        shell: pwsh

      - name: Publish self-contained single-file CLI
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'publish'
          dotnet publish src/Psarc2Tab.Cli/Psarc2Tab.Cli.csproj `
            --configuration Release `
            --runtime $env:RID `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=$version
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet publish failed.'
          }

      - name: Smoke-test the published CLI
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'publish'
          $executableName = if ($env:RID.StartsWith('win-')) { 'Psarc2Tab.Cli.exe' } else { 'Psarc2Tab.Cli' }
          $executable = Join-Path $publishDirectory $executableName
          & $executable --version
          if ($LASTEXITCODE -ne 0) {
            throw "The published $env:RID executable failed its version smoke test."
          }

      - name: Create release archive
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'publish'
          $packageName = "psarc2tab-$env:RELEASE_TAG-$env:RID.$env:PACKAGE_EXTENSION"
          $packagePath = Join-Path $env:RUNNER_TEMP $packageName
          if ($env:PACKAGE_EXTENSION -eq 'zip') {
            Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $packagePath
          }
          else {
            tar -czf $packagePath -C $publishDirectory .
            if ($LASTEXITCODE -ne 0) {
              throw 'Creating the tar.gz release archive failed.'
            }
          }

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: ${{ runner.temp }}/psarc2tab-${{ github.ref_name }}-${{ matrix.rid }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Create SHA-256 checksums
        run: sha256sum psarc2tab-* > SHA256SUMS.txt
        working-directory: release-assets

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes
